name: Daily YouTube Automation

on:
  schedule:
    # Runs daily at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  # Allows manual trigger anytime from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      action:
        description: 'Automation action to run'
        required: true
        default: 'run_now'
        type: choice
        options:
          - 'run_now'
          - 'prerender'

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Hindi Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-freefont-ttf

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Environment Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_PICKLE_BASE64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL || 'ajaymobulous@gmail.com' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          # Write .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> .env
          echo "PIXABAY_API_KEY=$PIXABAY_API_KEY" >> .env
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
          echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env
          echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" >> .env
          echo "YOUTUBE_CHANNEL_ID=$YOUTUBE_CHANNEL_ID" >> .env
          echo "NOTIFICATION_EMAIL=$NOTIFICATION_EMAIL" >> .env
          echo "SMTP_HOST=$SMTP_HOST" >> .env
          echo "SMTP_PORT=$SMTP_PORT" >> .env
          echo "SMTP_USER=$SMTP_USER" >> .env
          echo "SMTP_PASSWORD=$SMTP_PASSWORD" >> .env

          # Restore OAuth files if secrets are configured
          if [ -n "$YOUTUBE_CLIENT_SECRET_JSON" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          fi
          if [ -n "$YOUTUBE_TOKEN_PICKLE_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_PICKLE_BASE64" | base64 -d > youtube_token.pickle
          fi

      - name: Run YouTube Studio Automation (Produce Shorts & Long-Form Video)
        run: |
          python automation.py --run-all

      - name: Upload Artifacts (Rendered Videos & Metadata)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-youtube-output
          path: output/
          retention-days: 7
