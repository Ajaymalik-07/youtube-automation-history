name: Daily YouTube Automation

on:
  schedule:
    # 5 Daily Shorts release windows + Longform (all UTC times convert to IST UTC+5:30)
    - cron: '30 3 * * *'   # 09:00 AM IST — Short 1/5
    - cron: '30 6 * * *'   # 12:00 PM IST — Short 2/5
    - cron: '30 10 * * *'  # 04:00 PM IST — Short 3/5
    - cron: '30 13 * * *'  # 07:00 PM IST — Short 4/5 + 15+ Min Longform Documentary
    - cron: '30 16 * * *'  # 10:00 PM IST — Short 5/5
    - cron: '30 14 * * *'  # 08:00 PM IST — Pre-render tomorrow's batch overnight
  # Allows manual trigger anytime from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      action:
        description: 'Automation action to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'run_now'
          - 'prerender'

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Hindi Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-freefont-ttf

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Environment Secrets
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        run: |
          if [ -n "$DOT_ENV" ]; then
            echo "Using single DOT_ENV secret file..."
            echo "$DOT_ENV" > .env
          else
            # Fallback if DOT_ENV is not set
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> .env
            echo "PIXABAY_API_KEY=$PIXABAY_API_KEY" >> .env
            echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
            echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" >> .env
            echo "YOUTUBE_CHANNEL_ID=$YOUTUBE_CHANNEL_ID" >> .env
            echo "YOUTUBE_CLIENT_ID=$YOUTUBE_CLIENT_ID" >> .env
            echo "YOUTUBE_CLIENT_SECRET=$YOUTUBE_CLIENT_SECRET" >> .env
            echo "YOUTUBE_TOKEN_BASE64=$YOUTUBE_TOKEN_BASE64" >> .env
          fi

      - name: Restore YouTube OAuth Credentials & Token
        run: |
          python -c "import config; config.sync_client_secret_file(); config.sync_youtube_token_file()"
          if [ -f "youtube_token.pickle" ]; then
            echo "✅ youtube_token.pickle successfully loaded for live YouTube publishing."
          else
            echo "ℹ Notice: youtube_token.pickle not found. Will save rendered output to pending_uploads."
          fi

      - name: Run YouTube Studio Automation
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ "$ACTION" = "run_now" ]; then
            python automation.py --run-all
          elif [ "$ACTION" = "prerender" ]; then
            python automation.py --prerender
          else
            python automation.py --auto
          fi

      - name: Upload Artifacts (Rendered Videos & Metadata)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-youtube-output
          path: output/
          retention-days: 7
